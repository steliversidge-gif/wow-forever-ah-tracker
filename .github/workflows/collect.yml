name: Collect and publish

# Runs the collector on GitHub's machines so nothing depends on a home PC.
# The SQLite database travels between runs as an asset on a release named
# "state"; the dashboard is published to GitHub Pages.
#
# Timing: Blizzard publishes a new snapshot hourly at about :25:25.
#
# GitHub's scheduler is unreliable here (no runs for the first hours, then one
# in four hours), so the workflow also restarts itself: the "next" job waits
# until :27 and starts the following run, unless a scheduled run has already
# started since the snapshot was published. Every hour GitHub's schedule
# covers, the chain does nothing. If collection ever stops, press "Run
# workflow" once in the Actions tab to restart the chain.

on:
  schedule:
    # GitHub starts scheduled runs anywhere from on time to several minutes
    # late, so the tries bracket the publish time: :23 catches it when the
    # scheduler slips, :26 when it is punctual, and :30 / :40 / :58 are
    # catch-ups. An unchanged snapshot costs one cheap 304 per house and skips
    # the upload and deploy.
    - cron: "23,26,30,40,58 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config.toml", "src/**", "pyproject.toml", ".github/workflows/collect.yml"]

permissions:
  contents: write   # release asset holding the database
  pages: write
  id-token: write
  actions: write    # lets a run start the next one

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:      # one collector at a time: they share the database
      group: collect
      cancel-in-progress: false
    outputs:
      updated: ${{ steps.run.outputs.updated }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install .

      - name: Restore database
        run: |
          mkdir -p data
          if gh release view state >/dev/null 2>&1; then
            name=$(gh release view state --json assets -q '.assets | sort_by(.createdAt) | last | .name // empty')
            if [ -n "$name" ]; then
              gh release download state -p "$name" -O data/forever_ah.db.zst
              zstd -d --rm data/forever_ah.db.zst
            fi
          else
            gh release create state --title "Collector state" --latest=false \
              --notes "Database carried between collector runs. Managed by the workflow; do not edit."
          fi

      - name: Collect, analyse, export
        id: run
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        # A push may have changed settings or code, so it rebuilds every recommendation.
        run: python -m forever_ah run ${{ github.event_name == 'push' && '--reanalyse' || '' }}

      - name: Save database
        if: steps.run.outputs.updated == 'true'
        run: |
          asset="forever_ah-${{ github.run_id }}-${{ github.run_attempt }}.db.zst"
          zstd -T0 -9 data/forever_ah.db -o "$asset"
          gh release upload state "$asset"
          # Upload first, then prune: keep the two newest so a failed upload never loses the state.
          gh release view state --json assets -q '.assets | sort_by(.createdAt) | reverse | .[2:] | .[].name' \
            | while read -r old; do gh release delete-asset state "$old" -y; done

      - name: Upload dashboard
        if: steps.run.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows after 60 days without a commit.
        if: github.event_name != 'push'
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((30 * 86400)) ]; then
            date -u +%F > .github/heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat
            git commit -m "chore: monthly heartbeat so the schedule stays enabled"
            git push
          fi

  deploy:
    needs: collect
    if: needs.collect.outputs.updated == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  next:
    # Backstop for GitHub's scheduler: wait for Blizzard's next snapshot, then
    # start the next run - unless another run has already started since that
    # snapshot was published, in which case that run carries the chain on.
    # Only the newest waiter survives, so runs never multiply the chain.
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: collect-next
      cancel-in-progress: true
    env:
      GH_REPO: ${{ github.repository }}
      UPDATED: ${{ needs.collect.outputs.updated }}
    steps:
      - name: Wait, then start the next run
        run: |
          now=$(date -u +%s)
          minute=$(( (now % 3600) / 60 ))
          if [ "$UPDATED" != "true" ] && [ "$minute" -ge 26 ] && [ "$minute" -lt 50 ]; then
            # Nothing new although the snapshot was due: it is late, so look again shortly.
            wait=300
          else
            target=$(( now - now % 3600 + 27 * 60 ))
            if [ "$target" -le $(( now + 20 )) ]; then target=$(( target + 3600 )); fi
            wait=$(( target - now ))
          fi
          # A run only covers this hour if it started after the snapshot was
          # published (:25:30) and after this wait began.
          wake=$(( now + wait ))
          published=$(( wake - wake % 3600 + 25 * 60 + 30 ))
          if [ "$published" -lt "$now" ]; then published=$now; fi
          since=$(date -u -d "@$published" +%Y-%m-%dT%H:%M:%SZ)
          echo "Starting the next run in ${wait}s unless another run starts after $since"
          sleep "$wait"
          others=$(gh run list --workflow collect.yml --created ">$since" --limit 20 --json databaseId -q '[.[] | select(.databaseId != ${{ github.run_id }})] | length')
          if [ "${others:-0}" -gt 0 ]; then
            echo "Another run has already started for this snapshot: nothing to do."
          else
            # GitHub occasionally fails to start a run ("startup failure"), which
            # would silently end the chain, so check it started and try again.
            for attempt in 1 2 3 4 5; do
              gh workflow run collect.yml --ref "${{ github.ref_name }}"
              sleep 45
              state=$(gh run list --workflow collect.yml --event workflow_dispatch --limit 1 --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
              echo "Attempt $attempt: newest started run is $state"
              case "$state" in *startup_failure*) sleep 60 ;; *) break ;; esac
            done
          fi
